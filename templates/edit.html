<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Edit Student</h1>

    <p>Update the student's information</p>

    <form method="POST">

        <label>Name:</label>
        <input type="text"
               name="name"
               value="{{ student[1] }}"
               required>

        <label>Email:</label>
        <input type="email"
               name="email"
               value="{{ student[2] }}"
               required>

        <label>Course:</label>
        <input type="text"
               name="course"
               value="{{ student[3] }}"
               required>

        <label>Age:</label>
        <input type="number"
               name="age"
               value="{{ student[4] }}"
               required>

        <button type="submit">
            Update Student
        </button>

    </form>

    <p>
        <a href="/">Back to Student List</a>
    </p>

</body>

</html>
